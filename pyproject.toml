[project]
name = "praxis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "fastapi>=0.137.2",
    "uvicorn[standard]>=0.49.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.28",
    "pgvector>=0.3",
    "mcp>=1.2",
    "pycognito>=2024.5",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
    "pillow>=11.0",
    "psd-tools>=1.10",
    "imagehash>=4.3",
    "yoyo-migrations>=9.0.0",
    "slowapi>=0.1.10",
]

[project.scripts]
praxis-mcp = "knowledge.mcp.server:main"

[project.optional-dependencies]
# Phoenix/OpenTelemetry tracing — install with `uv sync --extra observability`.
observability = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "ruff>=0.15",
    "opentelemetry-sdk>=1.20",
    # Pair the exporter with the SDK so the default dev env can actually export
    # traces when PHOENIX_COLLECTOR_ENDPOINT is set; the SDK alone can't. Tracing
    # stays gated on that env var, so installing this never turns tracing on by itself.
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[tool.pytest.ini_options]
# agent_factory/{src,} mirror what agent_factory/pyproject.toml declares as `["src", "."]`. Both are
# needed HERE because pytest applies the config file it resolved for the RUN, not one per test path:
# invoked at the root, agent_factory's own pythonpath never loads, and its tests import `hooks` and
# `evals` as top-level modules.
pythonpath = [".", "frontend", "agent_factory", "agent_factory/src"]
# agent_factory/tests is in here deliberately. It has its own pyproject + venv, and because of that
# it was in NO testpath — so the whole factory (the af-build loop, the gates, af-clean) shipped
# untested by CI while `pytest -q` reported green. It runs fine from the root env; agent_factory's
# own venv is the one that cannot run it (test_tag_normalization imports knowledge.mcp.server,
# which needs httpx, a root dependency). Run it from here, not from there.
testpaths = ["knowledge", "frontend/tests", "agent_factory/tests"]

[tool.ruff]
# Keep ruff's default lint set (pyflakes F + pycodestyle E4/E7/E9): high-signal,
# low-noise — real bugs (unused imports/vars, undefined names) over style churn.
# Widen `lint.select` deliberately if the team wants import-sorting/formatting too.
target-version = "py314"
