# Campaigns af-ml-campaign-queue.sh runs, in order. One row per campaign; edit this, not the script.
#
#   name | repo | space_file | model_id | stages | ledger | corpus | dispatch
#
# repo is the working directory the dispatch runs in -- the LAB repo, not praxis. det_lab and
# contact_lab import only from /workspace/sports_analysis; the registry CLI runs in /workspace/praxis.
#
# ledger and corpus may be empty; both are preflighted when given, and a campaign whose corpus is
# absent on this machine is refused BEFORE it is dispatched rather than six hours into a run.
#
# A dispatch still containing ARM, TAG or STAGE is a template. The queue reports that as
# "NO IMPLEMENTED ARM LEFT TO RUN -- an agent must author arms" and stops. That is the truthful
# state of this backlog: about nine implemented arms exist against 152 ideas, and no shell loop can
# author the tenth. Replace the placeholder with a concrete command only when an arm actually exists.
#
# NEVER ADD:
#   association model-1d148ef55231  -- no composing module (src/assoc_lab has no campaign.py).
#   C1 court-marking model-16659b6b8e45 -- not ready.
# Both are refused by name AND by model id, and a refusal aborts the whole queue.

detection|/workspace/sports_analysis|/workspace/sports_analysis/ml/detection/registry/space.json|model-533010b57800|representation,architecture,augmentation,training,tuning,capacity|/workspace/sports_analysis/ml/detection/results.tsv|/workspace/sports_analysis/ml/detection/registry|uv run python -m det_lab.campaign run --arm ARM --tag TAG

