# Agent-supervised campaign queue, run in order. One agent at a time.
#   name|space-file|model-id|stages
#
# Unlike af-ml-campaign-queue.conf, association IS listed here. It has no composing module, so a
# shell loop cannot drive it -- but an AGENT can, and its six implemented toggles are all measured
# non-moves, so authoring new arms is the only way it ever progresses. That is exactly this queue's
# job. Detection leads because its corpus and arms are staged and proven.
#
# C1 court-marking (model-16659b6b8e45) is deliberately absent and is refused by name and by model
# id if anyone adds it: it has no in-regime ground truth and must not be supervised.

