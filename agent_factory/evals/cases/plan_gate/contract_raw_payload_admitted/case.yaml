# Positive control for the RAW payload shape: a ``contract_signature.build_signed_payload`` dict
# (kind/n_assertions/actions/signer) with >=1 real evaluator action ADMITS. The sibling
# contract_signed_admitted case covers the REDUCED {signed, actions_recorded} shape that
# plan_gate_check.read_contract produces; both shapes must be understood, otherwise a caller that
# threads the episode payload straight through would be told its real contract was unsigned.
id: plan_gate_contract_raw_payload_admitted
component: plan_gate
input:
  project: team-app
  contract:
    kind: "contract-signed"
    n_assertions: 75
    actions: {cut: 4, merged: 2, added: 1}
    signer: "evaluator"
  requirements:
    - id: R1
      text: "A submission is completed when the daily rep AND all three ratings are submitted."
      acceptance: "completed=true iff rep present and effort/focus/support all non-None."
      defines: ["daily completion"]
      references: []
      source: "prd-team-app"
  out_of_scope: []
rule_ids: ["R-ACCEPT-BINARY", "R-NO-VAGUE", "R-NO-DANGLING", "R-HAS-SOURCE", "R-CONTRACT-SIGNED"]
deterministic_checks:
  - name: gate_admits
    ref: "evals.checks:gate_admits"
