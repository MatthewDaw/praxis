# ANTI-GOODHART: a properly signed ``contract-signed`` payload with a fat assertion count but ALL-ZERO
# evaluator actions is a signature over an unchanged draft, so it still REJECTS. The n_assertions
# count is informational and never the gate (KTD3). Its message is distinct from the absent case so
# the operator can tell which state the plan is in.
id: plan_gate_contract_zero_actions_rejected
component: plan_gate
input:
  project: team-app
  contract:
    kind: "contract-signed"
    n_assertions: 75
    actions: {cut: 0, merged: 0, added: 0}
    signer: "evaluator"
  requirements:
    - id: R1
      text: "A submission is completed when the daily rep AND all three ratings are submitted."
      acceptance: "completed=true iff rep present and effort/focus/support all non-None."
      defines: ["daily completion"]
      references: []
      source: "prd-team-app"
  out_of_scope: []
rule_ids: ["R-CONTRACT-SIGNED"]
deterministic_checks:
  - name: gate_rejects
    ref: "evals.checks:gate_rejects"
    params:
      reason_contains: "NO evaluator actions"
