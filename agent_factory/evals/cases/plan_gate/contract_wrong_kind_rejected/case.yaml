# A payload that LOOKS like a contract but whose ``kind`` is not ``contract-signed`` is not a signed
# contract, however many actions it claims. It rejects as UNSIGNED/malformed (a distinct message from
# the absent case), so a mislabelled or hand-rolled episode cannot satisfy the bless predicate.
id: plan_gate_contract_wrong_kind_rejected
component: plan_gate
input:
  project: team-app
  contract:
    kind: "plan-reviewed"
    n_assertions: 75
    actions: {cut: 4, merged: 2, added: 1}
    signer: "evaluator"
  requirements:
    - id: R1
      text: "A submission is completed when the daily rep AND all three ratings are submitted."
      acceptance: "completed=true iff rep present and effort/focus/support all non-None."
      defines: ["daily completion"]
      references: []
      source: "prd-team-app"
  out_of_scope: []
rule_ids: ["R-CONTRACT-SIGNED"]
deterministic_checks:
  - name: gate_rejects
    ref: "evals.checks:gate_rejects"
    params:
      reason_contains: "no signed contract"
