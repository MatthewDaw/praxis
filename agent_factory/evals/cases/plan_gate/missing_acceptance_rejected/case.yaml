# A requirement with no binary acceptance condition must be REJECTED (the core
# done-gate rule: every requirement maps to >=1 binary acceptance condition).
id: plan_gate_missing_acceptance_rejected
component: plan_gate
input:
  # A valid signed contract (evaluator actions recorded) so the plan-level R-CONTRACT-SIGNED rule
  # closes cleanly and this case keeps isolating the rule(s) it is about. Absent evidence now REJECTS
  # (the rule fails closed), so every case that expects to reach the other rules must supply it.
  contract:
    signed: true
    actions_recorded: true
  requirements:
    - id: R5
      text: "Coaches can see a team dashboard."
      acceptance: ""
      defines: ["team dashboard"]
      references: []
      source: "prd-team-app"
  out_of_scope: []
rule_ids: ["R-ACCEPT-BINARY"]
deterministic_checks:
  - name: gate_rejects
    ref: "evals.checks:gate_rejects"
    params:
      reason_contains: "no binary acceptance"
