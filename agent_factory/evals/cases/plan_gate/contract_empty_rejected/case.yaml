# An EMPTY contract dict carries no evidence either — it must reject with the same "no contract at
# all" message, not be treated as a supplied-and-therefore-checked contract. Guards the boundary
# between "absent" and "present but unsigned": `{}` is absent.
id: plan_gate_contract_empty_rejected
component: plan_gate
input:
  project: team-app
  contract: {}
  requirements:
    - id: R1
      text: "A submission is completed when the daily rep AND all three ratings are submitted."
      acceptance: "completed=true iff rep present and effort/focus/support all non-None."
      defines: ["daily completion"]
      references: []
      source: "prd-team-app"
  out_of_scope: []
rule_ids: ["R-CONTRACT-SIGNED"]
deterministic_checks:
  - name: gate_rejects
    ref: "evals.checks:gate_rejects"
    params:
      reason_contains: "NO contract evidence at all"
