# The companion to the admitted case: allowlisting `aws` must NOT hand agents a way to satisfy the
# rule against a local stub. This body is machine-draftable (same verb, same read-only shape) and
# the gate still REJECTS it, because the endpoint is localstack rather than the account. Widening
# the verb allowlist widened who can author a check, never what counts as live.
id: plan_gate_external_state_machine_drafted_mocked_check_rejected
component: plan_gate
input:
  project: farm
  contract:
    signed: true
    actions_recorded: true
  checks:
    - check_id: corpus-materialised-in-localstack
      applies_to: ["acquisition"]
      run: "aws s3 ls s3://farm-corpus/raw/ --endpoint-url=http://localhost:4566"
  requirements:
    - id: R1
      text: "The corpus is transferred to S3 under raw/ by streaming rclone copy with no local staging."
      acceptance: "S3 object count under raw/ equals 3087 and total bytes match the source."
      defines: ["acquisition manifest"]
      references: []
      source: "prd-farm"
      tags: ["acquisition"]
      verify: "automated"
  out_of_scope: []
rule_ids: ["R-EXTERNAL-STATE-NEEDS-LIVE-CHECK"]
deterministic_checks:
  - name: gate_rejects
    ref: "evals.checks:gate_rejects"
    params:
      reason_contains: "claims external state"
  - name: run_bodies_machine_draftable
    ref: "evals.checks:run_bodies_machine_draftable"
    params:
      runs:
        - "aws s3 ls s3://farm-corpus/raw/ --endpoint-url=http://localhost:4566"
