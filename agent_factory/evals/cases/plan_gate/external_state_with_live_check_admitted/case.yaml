# Positive control: the same ticket, but a check whose command actually queries S3. The rule stands
# down — this is what "prove it against the real system" looks like.
id: plan_gate_external_state_with_live_check_admitted
component: plan_gate
input:
  project: farm
  contract:
    signed: true
    actions_recorded: true
  checks:
    - check_id: tests-acquisition
      applies_to: ["acquisition"]
      run: "uv run --with pytest pytest tests/acquisition -q"
    - check_id: corpus-materialised-in-s3
      applies_to: ["acquisition"]
      run: "aws s3 ls s3://farm-corpus/raw/ --recursive --summarize"
  requirements:
    - id: R1
      text: "The corpus is transferred to S3 under raw/ by streaming rclone copy with no local staging."
      acceptance: "S3 object count under raw/ equals 3087 and total bytes match the source."
      defines: ["acquisition manifest"]
      references: []
      source: "prd-farm"
      tags: ["acquisition"]
      verify: "automated"
  out_of_scope: []
rule_ids: ["R-EXTERNAL-STATE-NEEDS-LIVE-CHECK", "R-CONTRACT-SIGNED"]
deterministic_checks:
  - name: gate_admits
    ref: "evals.checks:gate_admits"
