# Negative control for the ACQUISITION half of R-EXTERNAL-STATE-NEEDS-LIVE-CHECK. This ticket names
# no cloud noun at all — no bucket, no S3, no URL — it just pulls ~33 GB in from an outside
# catalogue. Measured on the real prd-mvpvu-data-collection plan, its wording tripped nothing, so the
# three tickets moving the most bytes were the three the rule did not guard.
id: plan_gate_acquisition_verb_without_live_check_rejected
component: plan_gate
input:
  project: mvpvu-data-collection
  # supplied so this case isolates the rule under test; the
  # contract rule fails closed and would otherwise co-fire.
  contract:
    signed: true
    actions_recorded: true
  checks:
    - check_id: tests-acquisition
      applies_to: ["acquisition"]
      run: "uv run --with pytest pytest tests/acquisition -q"
  requirements:
    - id: R6
      text: "The selected games are acquired at panorama_hd from the mvpvu catalogue, and each acquired file is verified against its recorded checksum."
      acceptance: "At least 30 selected games are present at panorama_hd with a checksum matching the catalogue entry."
      defines: ["acquisition manifest"]
      references: []
      source: "prd-mvpvu-data-collection"
      tags: ["acquisition"]
      verify: "automated"
  out_of_scope: []
rule_ids: ["R-EXTERNAL-STATE-NEEDS-LIVE-CHECK"]
deterministic_checks:
  - name: gate_rejects
    ref: "evals.checks:gate_rejects"
