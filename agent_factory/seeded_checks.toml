# Seeded generic verification checks — the single source of truth for reusable checks the
# factory offers the check-authoring agent as OPT-IN candidates during RESOLVE (see U1/U3 of
# docs/plans/2026-07-21-001-feat-graded-rubric-checks-plan.md).
#
# TO ADD A CHECK: append one [[check]] block below. That is the ONLY edit needed — no code
# change. `check_id` must be unique. Keep it appendable and diff-friendly.
#
# Fields:
#   check_id            required, unique slug
#   kind                "binary" (exit-code) or "graded" (min-of-axes rubric); default "binary"
#   applies_to          candidate-offer tags; ["*"] = offered to every ticket (still opt-in)
#   promote_universal   optional bool; if true it is injected into the MANDATORY lane of every
#                       non-exempt ticket (tag-independent) by _ticket_state.contract_with_floor
#   report_only         optional bool (promote_universal only); graded + recorded but NON-gating —
#                       the calibration-rollout knob. Flip to false (one edit) to make it GATE.
#   criterion           human description of what "done" means
#   run                 (binary only) command whose non-zero exit is failure
#   confidence_floor    (graded only) 1..10; defects below this are dropped, default 5
#   judge_prompt        (graded only) extra guidance handed to the fresh-context judge
#   [[check.axes]]      (graded only) one per scored dimension: name, threshold (0..1), guidance
#   [check.anchors]     (graded only) literal good/slop code exemplars injected VERBATIM to pin taste

[[check]]
check_id = "correctness-review"
kind = "graded"
applies_to = ["*"]
criterion = "The change does what the ticket asks and holds up on its boundaries."
confidence_floor = 6
judge_prompt = "Judge only the diff's own logic; do not re-run tests (those are separate binary checks). Cite a file:line for any defect."
[[check.axes]]
name = "logic_correct"
threshold = 0.75
guidance = "The core behavior matches the ticket's stated intent with no logic errors."
[[check.axes]]
name = "edge_cases"
threshold = 0.6
guidance = "Boundary values, empty/nil inputs, and obvious concurrent access are handled, not just the happy path."

[[check]]
check_id = "security-review"
kind = "graded"
applies_to = ["*"]
criterion = "The change introduces no exploitable input-handling, authz, or secret-exposure defect."
confidence_floor = 6
judge_prompt = "Approve only with positive evidence of safety (e.g. inputs are validated HERE), never mere absence of a finding. Cite file:line for any defect."
[[check.axes]]
name = "input_validation"
threshold = 0.75
guidance = "Untrusted input is validated/escaped before use in queries, paths, or commands."
[[check.axes]]
name = "authz"
threshold = 0.8
guidance = "Permission checks guard the new surface; no privilege escalation or missing gate."
[[check.axes]]
name = "secret_handling"
threshold = 0.85
guidance = "No hardcoded secrets; credentials are read from the keychain/env, never logged."

[[check]]
check_id = "error-paths-covered"
kind = "graded"
applies_to = ["*"]
criterion = "Failure modes are handled and cleaned up, not just the happy path."
confidence_floor = 5
judge_prompt = "Trace the failure path with the diff in hand. Cite file:line for any unhandled failure or orphaned state."
[[check.axes]]
name = "failure_handling"
threshold = 0.7
guidance = "Invalid input, downstream failures, and timeouts are handled explicitly rather than swallowed."
[[check.axes]]
name = "cleanup_on_failure"
threshold = 0.65
guidance = "State persisted before a risky call is cleaned up on failure, or retry is idempotent."

[[check]]
check_id = "maintainability-review"
kind = "graded"
applies_to = ["*"]
criterion = "The change is clear and carries no dead weight."
confidence_floor = 7
judge_prompt = "Be conservative — style nitpicks are not defects. Fail only on genuine clarity or dead-code problems, with a file:line."
[[check.axes]]
name = "clarity"
threshold = 0.6
guidance = "Names and structure make intent obvious; no needless indirection or premature abstraction."
[[check.axes]]
name = "no_dead_code"
threshold = 0.7
guidance = "No unreachable code, unused symbols, or commented-out blocks left behind."

# ---------------------------------------------------------------------------------------------------
# UNIVERSAL, always-enforced minimalism/dedup/DRY gate. promote_universal => injected into the
# mandatory lane of every non-exempt ticket (a vendored/generated/config ticket, or one carrying
# meta.universal_exempt, is omitted — it has nothing to minimize). GATING: report_only = false, so a
# below-threshold axis BLOCKS the ticket rather than merely recording a verdict. It shipped
# report_only = true and was flipped once the anchors proved calibrated. Anchors are literal,
# copy-pasted exemplars from the
# repo's clean-code conventions (see the `clean-code` / `simplify` skills), injected verbatim.
[[check]]
check_id = "minimalism-dry"
kind = "graded"
applies_to = ["*"]
promote_universal = true
report_only = false
criterion = "The change is the minimum code that does the job — no dead or speculative code, no duplication, no needless fragmentation, and shared logic factored once (DRY)."
confidence_floor = 8
judge_prompt = "Grade strictly to the CALIBRATION anchors, not an external opinion of taste. Fail only on a LOCATED (file:line) instance of dead/speculative code, copy-pasted logic, needless fragmentation, or a needless abstraction — never on vague dissatisfaction. A NEGATIVE anchor's shape is never itself a defect. Do not re-run tests."
# "proportionality" is minimalism RE-GUIDED (B36): the axis schema is score>=threshold with no way
# to fail high, so both poles of slop — bloat (dead/speculative code) AND fragmentation (splitting one
# easy-to-read block into several tiny once-called helpers/files) — are graded as violations of the
# SAME axis, at the SAME direction (low score), rather than needing a second, opposite-signed axis.
[[check.axes]]
name = "proportionality"
threshold = 0.8
guidance = "Every line AND every abstraction earns its place: no dead code, unused symbols, speculative generality, or needless fragmentation (splitting a single easy-to-read block into multiple tiny helpers/files that are each used exactly once, for no reason beyond 'smaller'). Sized proportionally to what it does — neither bloated nor fragmented."
[[check.axes]]
name = "deduplication"
threshold = 0.8
guidance = "No copy-pasted blocks: near-identical logic appearing 2+ times is consolidated, not duplicated."
[[check.axes]]
name = "dry"
threshold = 0.75
guidance = "A single source of truth for each piece of logic/knowledge; shared behavior lives in one named helper, not re-implemented per caller."
[check.anchors]
good = [
  # Minimal — the simplest thing that works, no speculative abstraction:
  "def total(items):\n    return sum(i.price for i in items)",
  # DRY — the shared transform is factored into one named helper:
  "def _slug(s):\n    return s.strip().lower().replace(' ', '-')\n\ntitle_slug = _slug(title)\ntag_slug = _slug(tag)\ncategory_slug = _slug(category)",
  # No dead code — only the values that are actually returned are computed:
  "def parse(line):\n    key, value = line.split('=', 1)\n    return key.strip(), value.strip()",
]
slop = [
  # Speculative abstraction — a strategy hierarchy with exactly one implementation, never overridden:
  "class AbstractTotalStrategy:\n    def compute(self, items): ...\n\nclass DefaultTotalStrategy(AbstractTotalStrategy):\n    def compute(self, items):\n        return sum(i.price for i in items)",
  # Copy-paste — the same transform re-implemented at every call site instead of a shared helper:
  "title_slug = title.strip().lower().replace(' ', '-')\ntag_slug = tag.strip().lower().replace(' ', '-')\ncategory_slug = category.strip().lower().replace(' ', '-')",
  # Dead code — locals and a flag that are computed but never used:
  "def parse(line):\n    parts = line.split('=', 1)\n    key = parts[0]\n    value = parts[1]\n    joined = '\\n'.join(parts)  # computed, never used\n    debug = False              # speculative flag, always False\n    return key.strip(), value.strip()",
  # Fragmentation — one easy-to-read block split into three helpers, each called exactly once:
  "def _get_price(item):\n    return item.price\n\ndef _get_quantity(item):\n    return item.quantity\n\ndef total(items):\n    return sum(_get_price(i) * _get_quantity(i) for i in items)",
]
# NEGATIVE anchors (B37): code that LOOKS slop-shaped but is a legitimate, named pattern — the judge
# must NOT flag these shapes. One per named false-positive shape (F-D); the first is TypeScript,
# proving the rubric grades a TS diff as readily as a Python one.
negative = [
  # Shape: legitimate unknown-narrowing guard (TypeScript) — looks verbose, but each check is load-bearing.
  "function isUser(x: unknown): x is User {\n  return typeof x === 'object' && x !== null && 'id' in x && 'name' in x;\n}",
  # Shape: deliberate, documented silent catch — not dead/speculative, the no-op IS the behavior.
  "try:\n    cache.delete(key)\nexcept KeyError:\n    pass  # already evicted by TTL; deleting a missing key is an intentional no-op",
  # Shape: twice-used thin primitive — one line, but DRY-ing two real call sites, not speculative.
  "def _clamp(x, lo, hi):\n    return max(lo, min(hi, x))\n\nvolume = _clamp(volume, 0, 100)\nbrightness = _clamp(brightness, 0, 100)",
  # Shape: computed-key lookup table — a dict comprehension, not fragmentation into per-key branches.
  "HANDLERS = {f\"on_{event}\": handler for event, handler in _EVENT_SPECS}",
]

# ---------------------------------------------------------------------------------------------------
# UNIVERSAL typing/lint posture gate. Same universal lane as `minimalism-dry`, and now GATING for the
# same reason: report_only = false, so a below-threshold axis BLOCKS the ticket. Flipped without the
# report-only calibration period the rollout plan called for — a deliberate call, so watch the
# blocked-ticket rate on the recorded verdicts and flip back if `no-escape-hatches` (0.95) or
# `annotation-completeness` (0.9) turn out to be mis-set against real diffs.
#
# `gate-integrity` is the axis that should NOT need calibration: it is binary and deterministic, and
# its threshold of 1.0 fails only a checker that demonstrably did not finish. If this check starts
# blocking tickets, expect it to be one of the other two.
#
# Applicability is resolved PER FILE from the repo's own toolchain (af_clean.toolchain.detect_toolchain),
# never from file extension: the axis is INERT where no checker is configured. Turning a checker ON,
# or flipping `strict` where it is off, is deliberately NOT this check's job — that is a repo-wide
# policy decision producing unbounded work, and af_clean.typing_posture reports it instead. The rule
# of thumb: af-clean satisfies the gate the repo chose; it does not choose the gate.
[[check]]
check_id = "typed-and-linted"
kind = "graded"
applies_to = ["*"]
promote_universal = true
report_only = false
criterion = "Code added or touched by this change is fully typed and lint-clean under the repo's own configured toolchain, and the checkers actually ran to completion."
confidence_floor = 5
judge_prompt = "Score each axis 0-1 against the diff and the checker output. Read the checker's SUMMARY LINE, not just its exit code. If the tool aborted, gate-integrity is 0 regardless of how few errors were listed, and the other axes are unscorable — say so rather than guessing. Grade only against the checker the repo has ALREADY configured: if none is configured for a file's language, this check is inert for that file and every axis passes. Cite file:line for any defect."
[[check.axes]]
name = "annotation-completeness"
threshold = 0.9
guidance = "Every function, method and exported symbol the diff adds or touches carries parameter and return annotations. Score low for a bare `def f(x):` or an untyped exported function. Bare generics (`dict` rather than `dict[str, X]`, `Array` rather than `Array<X>`) count as incomplete."
[[check.axes]]
name = "no-escape-hatches"
threshold = 0.95
guidance = "Type errors are FIXED, not silenced. Score low for a new blanket `# type: ignore`, `@ts-ignore`, `@ts-expect-error` without a linked reason, `any`/`Any` used to widen away a real error, a new `exclude` entry, or a lint-rule disable comment. A pre-existing, documented exemption (a vendored tree) is not a violation; a NEW one to make this diff pass is."
# threshold 1.0 on purpose: this is the only BINARY axis here. Either the tool ran or its verdict is
# worthless, and an aborted checker reporting few errors must never score as clean — that exact
# mistake turned a real 2261-error backend into a quoted "74 errors" that a build gate consumed.
[[check.axes]]
name = "gate-integrity"
threshold = 1.0
guidance = "The checker completed. Score ZERO if its output contains an abort marker (`errors prevented further checking`, a tsconfig parse failure, a pytest collection error) or if the file count it reports analysing is implausible against the repo census. An aborted checker reporting few errors must never score as clean."
[check.anchors]
good = [
  # Fully annotated, precise generics, no escape hatch:
  "def read_text(path: str | Path) -> str | None:\n    try:\n        return Path(path).read_text(encoding='utf-8')\n    except OSError:\n        return None",
  # The fixture typed ONCE at its definition site, collapsing the errors at every call site:
  "@pytest.fixture\ndef client(app: FastAPI) -> TestClient:\n    return TestClient(app)",
  # TypeScript: the error is FIXED by narrowing, not silenced by a cast:
  "function label(x: string | null): string {\n  return x === null ? 'unknown' : x;\n}",
]
slop = [
  # Untyped signature in a repo whose mypy is configured strict:
  "def read_text(path):\n    return open(path).read()",
  # The error silenced rather than fixed — a blanket ignore with no reason:
  "result = client.fetch(url)  # type: ignore",
  # `any` smuggled in to make the compiler stop complaining:
  "function label(x: any): string {\n  return x;\n}",
  # A new exclude entry added so the checker stops looking at the file this diff touched:
  "[tool.mypy]\nexclude = ['appeal_api/services/scoring.py']",
]
# NEGATIVE anchors: shapes that LOOK like escape hatches or missing annotations but are neither.
negative = [
  # Shape: a NARROW, reasoned, linked ignore — the documented exemption, not a blanket silence.
  "# type: ignore[arg-type]  # upstream stub is wrong: httpx/httpx#3182, drop when >0.28 lands\nclient = Client(transport=transport)",
  # Shape: `Any` as the TRUE type — a passthrough that genuinely does not constrain its value.
  "def identity(value: Any) -> Any:\n    return value",
  # Shape: an inferred local with no annotation — annotation-completeness grades SIGNATURES, not locals.
  "def total(items: list[Item]) -> int:\n    running = 0\n    for item in items:\n        running += item.price\n    return running",
  # Shape: an untyped file in a language the repo configures NO checker for — the axis is inert here.
  "#!/usr/bin/env bash\nset -euo pipefail\nexec python -m appeal_api \"$@\"",
]

# --- Proof-against-reality family -----------------------------------------------------------------
# Three shapes for one recurring defect: a ticket whose acceptance is honest prose, whose tests pass,
# and which changed nothing. Each was paid for by a real plan where five tickets reached
# build_state="finished" having done no work. They are OPT-IN candidates, not universals — the
# check-authoring agent promotes the ones a given ticket needs.

[[check]]
check_id = "external-claim-proven-against-reality"
kind = "graded"
applies_to = ["*"]
criterion = "Where the ticket claims to change something outside the repo, the evidence is an observation of that system rather than a mock of it."
confidence_floor = 6
judge_prompt = "Read what the ticket CLAIMS, then ask what would still be true if the external system were switched off. If the tests would pass unchanged, the claim is unproven — say so and cite the file:line of the mock, fixture or stub standing in for reality. Mocked clients are legitimate in unit tests; the defect is a mock being the ONLY evidence for an external claim. Do not penalise a ticket that makes no external claim."
[[check.axes]]
name = "evidence_touches_the_system"
threshold = 0.8
guidance = "Something in the ticket's evidence queries the real bucket / instance / endpoint / database it claims to have changed. A moto, localstack or responses stub is not that. Observed: three acquisition tickets passed against a mocked S3 with no bucket in the account."
[[check.axes]]
name = "absence_is_reported"
threshold = 0.6
guidance = "Where the external system genuinely cannot be reached at build time, the ticket says so explicitly rather than quietly substituting a mock and reporting green."

[[check]]
check_id = "measurement-not-constant"
kind = "graded"
applies_to = ["*"]
criterion = "A value the ticket presents as measured is computed from its inputs, not returned from a constant or selected by a branch."
confidence_floor = 6
judge_prompt = "For every number the ticket reports as an error, score, offset, count or rate, trace where it comes from. A module-level constant returned as a 'measured' value is the defect — regardless of how plausible the constant is or how thorough the tests around it look. Ask: would this value differ if the input differed? Cite file:line."
[[check.axes]]
name = "derived_from_input"
threshold = 0.8
guidance = "Reported measurements are functions of the data. Observed: a reconstruction ticket returned reprojection_error_m from PHASE_CORRELATION_REPROJECTION_ERROR_M, a module constant, and its test asserted that constant was below another constant."
[[check.axes]]
name = "varies_across_inputs"
threshold = 0.7
guidance = "Two different inputs would produce two different outputs. A test that only ever exercises one input cannot distinguish a measurement from a constant."

[[check]]
check_id = "rendered-surface-has-substance"
kind = "graded"
applies_to = ["ui", "frontend", "surface"]
criterion = "A surface the ticket claims to render carries the content its specification enumerates, not a placeholder that satisfies an existence check."
confidence_floor = 6
judge_prompt = "Compare what the surface actually renders against what the ticket's own text enumerates — every named field, state, control and vocabulary value. Judge the rendered output, not the data structures behind it. Cite what is specified but absent."
[[check.axes]]
name = "specified_content_present"
threshold = 0.75
guidance = "Named layers, fields, states and enumerated values from the spec appear in the rendered output. Observed: a map view specifying five toggleable layers, an orthophoto overlay and an honesty panel shipped as '<h1>Map view</h1>' and passed a check asserting the route returned HTML."
[[check.axes]]
name = "not_built_to_the_assertion"
threshold = 0.6
guidance = "The surface is not a minimal artefact shaped to satisfy the literal strings a check greps for. Emitting exactly the four enumerated values as bare unstyled buttons, with nothing else the spec describes, is this failure."
