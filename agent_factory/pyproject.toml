[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-factory"
version = "0.1.0"
requires-python = ">=3.14"
# pyyaml is only reached from evals/ (dev tooling, exercised by tests) now that the fulfill domain
# loader is gone; it can be demoted to the dev group whenever the lock is next regenerated.
dependencies = [
    "pyyaml>=6.0.3",
]

# Operator-facing commands. There was no [project.scripts] table at all, so `af-retro --flags
# <project>` -- the command af-build/SKILL.md tells every agent to run at session start, and the
# whole of R24's push-not-pull flag guarantee -- named a binary that existed nowhere in .venv/bin.
# Both entry points wrap a `main(argv)` that already parses its own args and returns an exit status:
#   af-retro   -> the flag/lesson/check report (agent_factory.af_retro)
#   af-ingest  -> the lesson + plan-time authoring CLI: ingest / read / rollback-wave /
#                 author-check / author-lens (agent_factory.ingestion_api)
#   af-taxonomy -> the near-duplicate failure-class sweep (agent_factory.failure_taxonomy).
#                 The loop-end hook calls sweep_near_duplicate_classes() directly, in-process;
#                 this name exists so the sweep is ALSO runnable by an operator on demand
#                 (--dry-run reports what it would merge). A module-level main() that nothing
#                 can invoke is the exact zero-caller defect this build shipped once already.
# `python -m agent_factory.<module>` stays the invocation of record for anything running under the
# loop's own PYTHONPATH (af-ticket-loop.sh calls af_retro that way, off the EXIT trap); these names
# are for a human or an agent at a shell, where an installed console script is the only thing that
# works without knowing where the factory checkout lives. Keep both working: a module that grows a
# console script must keep its `if __name__ == "__main__"` block.
[project.scripts]
af-retro = "agent_factory.af_retro:main"
af-ingest = "agent_factory.ingestion_api:main"
af-taxonomy = "agent_factory.failure_taxonomy:main"

# The wireframe-conformance BROWSER gate (wireframe_browser_check.py) needs Playwright — the Python
# package here plus a one-time `python -m playwright install chromium` (~150 MB) that the module
# bootstraps idempotently on first use. It is an EXTRA, not a base dependency, so a factory install
# that never gates a UI surface pays nothing; but where the check IS pinned it fails LOUD (exit 2,
# remediation printed) when this extra is absent — it never skips or degrades to the parser.
[project.optional-dependencies]
browser = [
    "playwright>=1.45",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # Mutation testing (U5; R8, SC1, AE3) — report-only, never in the default pytest
    # run. Pinned to the 2.x line because evals/mutation.py parses the `mutmut results`
    # section format that 2.x emits (3.x changed the output shape).
    "mutmut>=2.4,<3",
]

# ``hooks/`` ships as a SECOND top-level package, not as a subpackage of ``agent_factory``.
# It has to: ``hooks/_ticket_state.py`` binds its siblings by their bare names (``import _praxis``),
# the hook entry points in ``hooks/hooks.json`` are launched as loose scripts out of that directory,
# and every test imports them as ``hooks.<mod>``. Renaming them into ``agent_factory.hooks`` would
# have to rewrite all three at once. Shipping the directory as-is keeps ONE import name across the
# source checkout, the loop's ``PYTHONPATH=<root>/hooks:<root>/src``, and an installed wheel --
# which is the whole point, since ``agent_factory.ingestion_api`` imports through it and was
# therefore unimportable from any wheel install before this. The cost is a generic top-level
# ``hooks`` name in site-packages; acceptable for a distribution that is never published to PyPI.
[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory", "hooks"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "hooks"]
testpaths = ["tests"]

# Mutation testing config (U5, KTD7). Run OUT-OF-BAND, never as part of `pytest`:
#   python -m mutmut run        # mutate the modules below, run the suite per mutant
#   python -m mutmut results    # list survivors -> feed to evals/mutation.py
# Report-first: kill-rate + a wanted-case worklist; it does NOT block CI this iteration.
[tool.mutmut]
paths_to_mutate = [
    "src/agent_factory/plan_gate.py",
    "src/agent_factory/gate.py",
    "evals/checks.py",
]
tests_dir = "tests/"
runner = "python -m pytest -q"
