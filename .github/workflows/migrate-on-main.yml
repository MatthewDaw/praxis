# Apply database migrations on merges into main.
#
# Applies the yoyo migrations under migrations/ — the single source of truth for
# the schema. yoyo records applied migrations in its `_yoyo_migration` ledger so
# each runs exactly once; re-running only applies what's new, so it's harmless.
#
# Triggers:
#   - push to main, scoped to migration-relevant paths (schema + migrations dir
#     + the dependency/lock files that affect how migrations install/run).
#   - workflow_dispatch, for unconditional manual runs.
#
# Required GitHub secrets (configure under Settings -> Secrets and variables -> Actions):
#   - PRAXIS_DB_URL  (preferred)  — a libpq/SQLAlchemy-style Postgres DSN. When set,
#                                   db.py uses it directly and AWS is not consulted.
#   OR, as a fallback, the AWS trio so db.py can resolve the DSN from Secrets Manager
#   (secret name PRAXIS_DB_SECRET, default "praxis/knowledge-graph/db"):
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - AWS_REGION     (e.g. us-east-1)
#
# SCHEMA SOURCE OF TRUTH:
#   * migrations/ is the whole schema. `0000_initial.sql` creates everything; every
#     later change (add a table/column, drop, type change, re-tenant, backfill) is a
#     new ordered migration. `python -m knowledge.serve.db` (bootstrap) IS `yoyo
#     apply` over this directory.
#   * A fresh DB replays all migrations; an existing DB only gets what's new.
#     `0000_initial` is idempotent (CREATE ... IF NOT EXISTS), so applying it to the
#     pre-existing prod DB is a safe no-op. There is no schema-diffing; parity
#     depends on every change being authored as a migration here.
#
# Some migrations may need extra secrets when they have rows to process (e.g.
# 0001_reembed_candidates re-embeds via OpenRouter and needs OPENROUTER_API_KEY
# when `candidates` still has rows — already wired into the apply step's env).
# Migrations no-op safely when there is nothing to process.
#
# WHICH DATABASE THIS TARGETS (and why the workflow used to fail on every push):
#   `resolve_dsn()` prefers PRAXIS_DB_URL over Secrets Manager. The repo secret of
#   that name holds the LOCAL dev URL (localhost:5433) — correct on a laptop, useless
#   on a runner, which has no Postgres of its own. So every run connected to loopback,
#   was refused, and the AWS path it should have taken was never even tried. The
#   migrations were silently never applied to the deployed database; nothing else
#   noticed, because failing to migrate looks exactly like having nothing to migrate.
#
#   So the DSN is resolved explicitly below: a NON-LOCAL PRAXIS_DB_URL is honored as
#   the deliberate override it is; a loopback one is dropped (with a note in the log)
#   so Secrets Manager answers instead. Neither resolving is a hard failure — this
#   workflow must never "succeed" having migrated nothing.
#
# NETWORK REACHABILITY: the RDS instance is publicly accessible and its security group
# allows 5432 from 0.0.0.0/0, so a GitHub-hosted runner reaches it directly. (An earlier
# note here assumed it could not; that was never the reason this failed.) If that ever
# tightens, this job needs another path in — a self-hosted runner in the VPC, an
# SSM/SSH bastion tunnel, or RDS Data API.

name: migrate-on-main

on:
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/migrate-on-main.yml'
  workflow_dispatch: {}

# Serialize migration runs so concurrent merges never apply migrations at the same
# time. Queue (don't cancel) so every merged change still gets its migrations run.
concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Connection config consumed by knowledge/serve/db.py. PRAXIS_DB_URL takes
      # precedence; the AWS trio is the Secrets Manager fallback path, which is
      # opt-in (PRAXIS_DB_ALLOW_REMOTE) so local scripts can't reach prod by
      # accident — CI explicitly allows it here.
      PRAXIS_DB_URL: ${{ secrets.PRAXIS_DB_URL }}
      PRAXIS_DB_ALLOW_REMOTE: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project + deps
        run: uv sync --frozen

      # A loopback PRAXIS_DB_URL cannot be what a runner meant — there is no local
      # Postgres here — and honoring it is what made every previous run fail while
      # the working AWS path sat unused. Drop it (only in this job's env) so
      # resolve_dsn() falls through to Secrets Manager. Uses the repo's own
      # `db.is_local_dsn`, so CI and the test guard agree on what "local" means.
      # The DSN itself is never echoed — only the decision.
      - name: Resolve the target database
        run: |
          kind=$(uv run python -c '
          import os
          from knowledge.serve import db
          url = os.environ.get("PRAXIS_DB_URL") or ""
          print("local" if url and db.is_local_dsn(url) else "explicit" if url else "unset")
          ')
          case "$kind" in
            local)
              echo "PRAXIS_DB_URL=" >> "$GITHUB_ENV"
              echo "::warning::the PRAXIS_DB_URL secret points at a LOCAL database, which a runner cannot reach. Ignoring it and resolving the DSN from Secrets Manager instead. Fix the secret (or delete it) to silence this."
              ;;
            explicit) echo "::notice::using the PRAXIS_DB_URL secret (non-local)." ;;
            *)        echo "::notice::PRAXIS_DB_URL unset; resolving via Secrets Manager." ;;
          esac

      - name: Apply migrations (yoyo)
        env:
          # The reembed migration embeds candidate text via OpenRouter when there
          # are rows to lift; no-ops (and so needs no key) once candidates is gone.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # bootstrap() == `yoyo apply` over migrations/ (the schema source of truth),
        # converting the DSN scheme to postgresql+psycopg internally.
        run: uv run python -m knowledge.serve.db

      # bootstrap() prints how many it applied, but a job that connected to the wrong
      # database, or applied only some of the set, would still exit 0 and read as a
      # successful migrate. Assert the ledger is actually caught up with migrations/,
      # so "green" means the schema is current and nothing else.
      - name: Verify nothing is left pending
        run: |
          uv run python - <<'PY'
          import sys
          from yoyo import get_backend, read_migrations
          from knowledge.serve import db

          dsn = db.resolve_dsn()
          if dsn is None:
              sys.exit("no DSN resolved — nothing was migrated (see the resolve step above)")
          backend = get_backend(db._yoyo_dsn(dsn))
          pending = backend.to_apply(read_migrations(str(db.MIGRATIONS_DIR)))
          if pending:
              sys.exit(f"{len(pending)} migration(s) still pending: "
                       + ", ".join(m.id for m in pending))
          print(f"verified: every migration in {db.MIGRATIONS_DIR.name}/ is applied")
          PY
